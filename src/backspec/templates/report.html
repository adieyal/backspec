   no shadows, no rounded corners. Each screen says one thing; detail opens only when asked for. */
@font-face { font-family: "Libre Baskerville"; font-weight: 400; font-style: normal; font-display: swap;
  src: url(data:font/woff2;base64,__BACKSPEC_FONT:libre-baskerville-400.woff2__) format("woff2") }
@font-face { font-family: "Libre Baskerville"; font-weight: 700; font-style: normal; font-display: swap;

:root {
  --bg: #fafaf9; --surface: #f5f5f4; --raised: #efedeb; --ink: #1c1917; --muted: #57534e; --faint: #8a837d; --stone: #78716c;
  --line: #e7e5e4; --line-mid: #d6d3d1;
  --ok: #4d7c0f; --warn: #a16207; --bad: #b91c1c;
  --ok-soft: #f0fdf4; --warn-soft: #fefce8; --bad-soft: #fef2f2; --ok-line: #bbf7d0; --warn-line: #fef08a; --bad-line: #fecaca;
  --serif: "Libre Baskerville", Georgia, "Times New Roman", serif;
  --sans: Inter, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  --mono: "Source Code Pro", "Fira Code", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #1c1917; --surface: #23201d; --raised: #2c2825; --ink: #f5f5f4; --muted: #b8b2ac; --faint: #8f8882; --stone: #a8a29e;
  --line: #322e2b; --line-mid: #44403c;
  --ok: #a3e635; --warn: #facc15; --bad: #fca5a5;
  --ok-soft: #1f2a12; --warn-soft: #2e2710; --bad-soft: #331a1a; --ok-line: #3a4d1c; --warn-line: #57480f; --bad-line: #5c2626;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #1c1917; --surface: #23201d; --raised: #2c2825; --ink: #f5f5f4; --muted: #b8b2ac; --faint: #8f8882; --stone: #a8a29e;
  --line: #322e2b; --line-mid: #44403c;
  --ok: #a3e635; --warn: #facc15; --bad: #fca5a5;
  --ok-soft: #1f2a12; --warn-soft: #2e2710; --bad-soft: #331a1a; --ok-line: #3a4d1c; --warn-line: #57480f; --bad-line: #5c2626;
  color-scheme: dark }

* { box-sizing: border-box; border-radius: 0 }
body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.7 var(--sans); -webkit-text-size-adjust: 100% }
button, input { font: inherit; color: inherit }
button { cursor: pointer; background: none; border: 0; padding: 0; text-align: left }
a { color: inherit }
:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--stone) }
.page { max-width: 728px; margin: 0 auto; padding-block: 36px 96px;
  padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 60px }

/* ---- masthead ---- */
.top { display: flex; justify-content: space-between; align-items: baseline; gap: 24px; flex-wrap: wrap }
.overline { font: 600 11px/1.4 var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--faint); margin: 0 }
.top nav { display: flex; gap: 24px; font-size: 13px }
.top nav a { color: var(--muted); text-decoration: none; padding-bottom: 2px; border-bottom: 1px solid transparent }
.top nav a:hover { color: var(--ink) }
.top nav a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--ink) }

/* ---- headings and prose ---- */
#view { display: flex; flex-direction: column; gap: 48px; min-width: 0 }
.intro { display: flex; flex-direction: column; gap: 24px }
h1 { margin: 0; font: 700 40px/1.2 var(--serif); letter-spacing: -.02em; text-wrap: balance; overflow-wrap: anywhere }
h1.sub { font-size: 30px; line-height: 1.3; letter-spacing: -.015em }
h2 { margin: 0; font: 400 22px/1.4 var(--serif); letter-spacing: -.01em; text-wrap: balance }
.lede { margin: 0; font-size: 20px; line-height: 1.75; color: var(--muted); max-width: 34em }
.lede b { color: var(--ink); font-weight: 600 }
.lede a { color: var(--ink); text-decoration-color: var(--line-mid); text-underline-offset: 4px }
.lede a:hover { text-decoration-color: var(--ink) }
.back { font-size: 13px; color: var(--muted); text-decoration: none; align-self: flex-start }
.back:hover { color: var(--ink) }
.quiet { margin: 0; font-size: 15px; color: var(--muted) }
.caption { font-size: 13px; line-height: 1.5; letter-spacing: .01em; color: var(--faint) }

/* ---- search ---- */
.search { width: 100%; height: 48px; padding: 12px 16px; font-size: 15px; background: var(--bg); border: 1px solid var(--line-mid) }
.search::placeholder { color: var(--faint) }
.search:focus { outline: none; border-color: var(--stone); box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--stone) }

/* ---- lists ---- */
.list { display: flex; flex-direction: column; border-top: 1px solid var(--line) }
.caprow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 24px; align-items: baseline; width: 100%;
  padding: 24px 0; border-bottom: 1px solid var(--line); text-decoration: none }
.caprow:hover h2 { text-decoration: underline; text-decoration-color: var(--line-mid); text-underline-offset: 5px }
.caprow p { margin: 0; grid-column: 1; font-size: 15px; color: var(--muted) }
.caprow .n { justify-self: end; font: 400 22px/1.4 var(--serif); color: var(--faint); font-variant-numeric: tabular-nums }
.caprow .flag { grid-column: 2; justify-self: end; font-size: 13px; color: var(--warn) }

.req { border-bottom: 1px solid var(--line) }
.req > button { display: flex; flex-direction: column; gap: 8px; width: 100%; padding: 24px 0 }
.req > button:hover .statement { color: var(--ink) }
.statement { font-size: 17px; line-height: 1.65; color: var(--ink); overflow-wrap: anywhere }
.req[data-open="false"] .statement { color: var(--muted) }
.req[data-open="false"] > button:hover .statement, .req[data-weak="true"] .statement { color: var(--ink) }
.sub { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center }
.chip { font: 600 11px/1.4 var(--sans); letter-spacing: .04em; text-transform: uppercase; padding: 4px 10px; border: 1px solid var(--cl); background: var(--cs); color: var(--c) }
.detail { display: flex; flex-direction: column; gap: 36px; padding: 12px 0 48px }
.block { display: flex; flex-direction: column; gap: 12px; min-width: 0 }
.conds { margin: 0; padding-left: 20px; font-size: 15px; color: var(--muted); display: flex; flex-direction: column; gap: 6px }
.note { margin: 0; padding: 24px; background: var(--raised); font-size: 15px; line-height: 1.7 }
.scn { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 16px; font-size: 15px; margin: 0 }
.scn strong { grid-column: 1 / -1; font-weight: 600; margin-bottom: 4px }
.scn dt { color: var(--faint); font-size: 13px; line-height: 1.95 }
.scn dd { margin: 0; color: var(--muted) }
.cite { display: flex; flex-direction: column; gap: 6px; min-width: 0 }
.cite .where { font: 13px/1.5 var(--mono); color: var(--muted); overflow-wrap: anywhere }
.cite pre { margin: 0; overflow-x: auto; background: var(--surface); border: 1px solid var(--line); padding: 12px 0; font: 14px/1.7 var(--mono) }
.cite code { display: grid; grid-template-columns: max-content 1fr; column-gap: 16px; padding-right: 16px; font: inherit }
.cite .ln { text-align: right; padding-left: 16px; color: var(--faint); user-select: none; font-variant-numeric: tabular-nums }
.cite .tx { white-space: pre }
.idline button { font: 13px/1.5 var(--mono); color: var(--faint) }
.idline button:hover { color: var(--ink) }

/* ---- coverage ---- */
.bar { display: flex; height: 6px; gap: 2px }
.bar i { display: block; height: 100%; min-width: 4px; background: var(--c) }
details { border-bottom: 1px solid var(--line) }
details:first-of-type { border-top: 1px solid var(--line) }
summary { display: flex; justify-content: space-between; gap: 24px; align-items: baseline; padding: 16px 0; cursor: pointer; list-style: none; font-size: 15px }
summary::-webkit-details-marker { display: none }
summary::after { content: "+"; color: var(--faint); font: 400 17px/1 var(--sans) }
details[open] > summary::after { content: "\2212" }
summary .n { color: var(--faint); margin-left: auto; font-variant-numeric: tabular-nums }
summary:hover { color: var(--ink) }
.rows { list-style: none; margin: 0; padding: 0 0 24px; display: flex; flex-direction: column; gap: 12px }
.rows li { display: flex; flex-direction: column; gap: 2px; min-width: 0 }
.rows .path { font: 13px/1.6 var(--mono); overflow-wrap: anywhere }
.rows .text { font-size: 15px; color: var(--muted) }
.facts { margin: 0; padding: 0 0 24px; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 24px; font-size: 15px }
.facts dt { color: var(--faint) }
.facts dd { margin: 0; overflow-wrap: anywhere }
.section { display: flex; flex-direction: column; gap: 24px }
noscript p { font-size: 15px; color: var(--muted) }

@media (max-width: 560px) {
  body { font-size: 16px }
  .page { gap: 48px; padding-block: 24px 72px }
  h1 { font-size: 32px } h1.sub { font-size: 26px }
  .lede { font-size: 18px }
}

      el("p", { class: "lede" }, [el("b", { text: read + " of " + plural(files.length, "file") }), " were read. This shows where backspec looked. It does not show that everything in a file was found."]),
      el("div", { class: "bar", role: "img", "aria-label": groups.map(function (g) { return g[1].length + " " + g[0][1]; }).join(", ") },
        groups.map(function (g) { return el("i", { style: "flex:" + g[1].length + ";--c:var(" + g[0][2] + ")" }); }))]));
    box.appendChild(el("div", {}, groups.map(function (g) {
      return fold(g[0][1].charAt(0).toUpperCase() + g[0][1].slice(1), g[1].length, el("ul", { class: "rows" }, g[1].map(function (f) {
        var said = f.observations ? plural(f.observations, "observation") + (f.cited_by ? ", cited by " + plural(f.cited_by, "requirement") : ", cited by none") : (f.reason || "");
        if (f.read === "in_part" && f.lines_read) said = "read in part: " + f.lines_read + " of " + f.lines + " lines, " + plural(f.reached, "symbol") + " reached" + (said ? "  ·  " + said : "");
        return el("li", {}, [el("span", { class: "path", text: f.path }), said ? el("span", { class: "caption", text: said }) : null]); }))); })));
    var more = [], unused = (D.coverage && D.coverage.unused_observations) || {}, names = Object.keys(unused).filter(function (k) { return unused[k]; });
    if (names.length) more.push(fold("Evidence no requirement used", names.reduce(function (a, k) { return a + unused[k]; }, 0), el("ul", { class: "rows" }, names.map(function (k) {
      return el("li", {}, [el("span", { class: "text", text: capName[k] || k }), el("span", { class: "caption", text: plural(unused[k], "unused observation") })]); }))));
    var audit = D.coverage && D.coverage.triage_audit;
    if (audit && audit.skipped) more.push(fold("Check on the skipped files", audit.audited + " of " + audit.skipped, el("p", { class: "quiet", style: "padding-bottom:24px",
      text: plural(audit.audited, "skipped file") + (audit.audited === 1 ? " was" : " were") + " read anyway, and " + (audit.yielded ? audit.yielded + " held evidence." : "none held evidence.") +
        (audit.miss_rate_interval ? " With a sample this size, between " + Math.round(audit.miss_rate_interval[0] * 100) + "% and " + Math.round(audit.miss_rate_interval[1] * 100) + "% of skipped files could hold evidence." : "") })));
    var fol = D.follow;
    if (fol && (fol.files || []).length) {
      var rows = (fol.reached || []).map(function (r) { return el("li", {}, [el("span", { class: "text", text: r.symbol + "  (lines " + r.lines[0] + "-" + r.lines[1] + ")" }),
        el("span", { class: "path caption", text: r.path + "  ·  depth " + r.depth + ", called from " + r.called_from.join(", ") })]); });
      (fol.skipped || []).forEach(function (n) { rows.push(el("li", {}, [el("span", { class: "text", text: "Not followed: " + n.name }),
        el("span", { class: "caption", text: (n.reason === "generic" ? "too common a name to tell which is meant" : "defined " + n.definitions + " times") + "  ·  called from " + n.called_from.join(", ") })])); });
      (fol.ambiguous || []).forEach(function (n) { rows.push(el("li", {}, [el("span", { class: "text", text: "Followed to every match: " + n.name }),
        el("span", { class: "caption", text: n.definitions.join(", ") })])); });
      if (fol.unavailable) rows.unshift(el("li", {}, [el("span", { class: "text", text: fol.unavailable })]));

        el("div", {}, [el("p", { class: "quiet", text: "Files named by --follow are read only where the selected files call into them, up to " + fol.depth + " calls away. Calls are matched by name, so a match can be wrong; names too common or defined too often are not followed." }),
          el("ul", { class: "rows" }, rows)])));
    }
    var facts = [["Status", run.status + (run.stopped_after ? ", stopped after " + run.stopped_after : "") + (run.budget_reached ? ", token budget reached" : "")], ["Model backend", run.provider],
      ["Model calls", run.calls != null ? run.calls + (run.cached_calls ? " (and " + run.cached_calls + " from cache)" : "") : null],
      ["Tokens", run.input_tokens || run.output_tokens ? (run.input_tokens + run.output_tokens).toLocaleString() + (run.tokens_estimated ? " (estimated)" : "") : null],
      ["Cost", run.cost_usd ? "$" + run.cost_usd.toFixed(2) : null],
      ["Reused", run.reused_files ? plural(run.reused_files, "unchanged file") : null],
      ["Read in part", run.followed_files ? plural(run.followed_files, "followed file") : null],
      ["Parsed", run.syntax_files ? run.syntax_files + " of " + (run.syntax_files + (run.text_files || 0)) + " files with tree-sitter" : null],
      ["Observations", (D.observations || []).length ? (D.observations || []).length + " verified" : null], ["backspec", run.tool_version]].filter(function (f) { return f[1] != null && f[1] !== "undefined"; });
    more.push(fold("About this run", "", el("dl", { class: "facts" }, facts.reduce(function (a, f) { return a.concat([el("dt", { text: f[0] }), el("dd", { text: String(f[1]) })]); }, []))));
    box.appendChild(el("div", { class: "section" }, [overline("More"), el("div", {}, more)]));
  }

  /* ---- routing ---- */
  function draw() {
    var hash = (location.hash || "").slice(1), box = document.getElementById("view"), view = "overview";
    box.textContent = "";
    if (capOf[hash]) capability(box, capOf[hash]);
    else if (hash === "review") { view = "review"; review(box); }
