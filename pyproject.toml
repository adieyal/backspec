[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reqx"
version = "0.0.1"
description = "Extract user requirements from a codebase, with verified citations and a per-file account of what was read."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.6", "typer>=0.12", "pathspec>=0.12"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
reqx = "reqx.host.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/reqx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
