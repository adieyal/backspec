<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-label="backspec pipeline: discover, triage, observe and verify produce verified facts; orient and assign, synthesise, assess support and apply review turn them into requirements; every file's state goes to the report.">
  <style>
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328 }
    .name { font-size: 14px; font-weight: 600 }
    .sub { font-size: 12px; fill: #57606a }
    .lbl { font-size: 11px; fill: #57606a }
    .line { stroke: #57606a; stroke-width: 1.5; fill: none }
    .dash { stroke-dasharray: 5 4 }
    .head { fill: #57606a }
    .prog { fill: #f6f8fa; stroke: #8c959f; stroke-width: 1.5 }
    .fast { fill: #ddf4ff; stroke: #0969da; stroke-width: 1.5 }
    .strong { fill: #fbefff; stroke: #8250df; stroke-width: 1.5 }
    .input { fill: none; stroke: #8c959f; stroke-width: 1.5; stroke-dasharray: 5 4 }
    @media (prefers-color-scheme: dark) {
      text { fill: #e6edf3 }
      .sub, .lbl { fill: #9198a1 }
      .line { stroke: #9198a1 } .head { fill: #9198a1 }
      .prog { fill: #161b22; stroke: #656c76 }
      .fast { fill: #0c2d6b; stroke: #4493f8 }
      .strong { fill: #2e1a4f; stroke: #ab7df8 }
      .input { stroke: #656c76 }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" class="head"/>
    </marker>
  </defs>

  <!-- legend -->
  <rect x="560" y="26" width="14" height="14" rx="3" class="prog"/><text x="580" y="38" class="lbl">program, no model</text>
  <rect x="700" y="26" width="14" height="14" rx="3" class="fast"/><text x="720" y="38" class="lbl">fast model</text>
  <rect x="800" y="26" width="14" height="14" rx="3" class="strong"/><text x="820" y="38" class="lbl">strong model</text>

  <!-- inputs above -->
  <rect x="26" y="30" width="140" height="36" rx="6" class="input"/>
  <text x="96" y="53" text-anchor="middle" class="sub">your repository</text>
  <rect x="270" y="30" width="230" height="36" rx="6" class="input"/>
  <text x="385" y="53" text-anchor="middle" class="sub">previous result (optional)</text>
  <line x1="96" y1="66" x2="96" y2="118" class="line" marker-end="url(#arrow)"/>
  <line x1="300" y1="66" x2="300" y2="118" class="line dash" marker-end="url(#arrow)"/>
  <line x1="470" y1="66" x2="470" y2="118" class="line dash" marker-end="url(#arrow)"/>
  <text x="385" y="97" text-anchor="middle" class="lbl">unchanged files not read again</text>

  <!-- row A: evidence -->
  <rect x="26" y="120" width="140" height="60" rx="8" class="prog"/>
  <text x="96" y="145" text-anchor="middle" class="name">Discover</text>
  <text x="96" y="164" text-anchor="middle" class="sub">patterns, snapshots</text>
  <rect x="218" y="120" width="140" height="60" rx="8" class="fast"/>
  <text x="288" y="145" text-anchor="middle" class="name">Triage</text>
  <text x="288" y="164" text-anchor="middle" class="sub">skip sure misses</text>
  <rect x="410" y="120" width="140" height="60" rx="8" class="fast"/>
  <text x="480" y="145" text-anchor="middle" class="name">Observe</text>
  <text x="480" y="164" text-anchor="middle" class="sub">facts + line ranges</text>
  <rect x="602" y="120" width="140" height="60" rx="8" class="prog"/>
  <text x="672" y="145" text-anchor="middle" class="name">Verify</text>
  <text x="672" y="164" text-anchor="middle" class="sub">quote must match</text>
  <rect x="794" y="120" width="140" height="60" rx="8" class="prog"/>
  <text x="864" y="145" text-anchor="middle" class="name">Coverage</text>
  <text x="864" y="164" text-anchor="middle" class="sub">every file + reason</text>

  <line x1="166" y1="150" x2="216" y2="150" class="line" marker-end="url(#arrow)"/>
  <text x="192" y="142" text-anchor="middle" class="lbl">files</text>
  <line x1="358" y1="150" x2="408" y2="150" class="line" marker-end="url(#arrow)"/>
  <text x="384" y="142" text-anchor="middle" class="lbl">to read</text>
  <line x1="550" y1="150" x2="600" y2="150" class="line" marker-end="url(#arrow)"/>
  <text x="576" y="142" text-anchor="middle" class="lbl">facts</text>
  <line x1="742" y1="150" x2="792" y2="150" class="line" marker-end="url(#arrow)"/>
  <text x="768" y="142" text-anchor="middle" class="lbl">rejects</text>

  <!-- connector to row B -->
  <path d="M672 180 V240 H96 V298" class="line" marker-end="url(#arrow)"/>
  <text x="384" y="233" text-anchor="middle" class="lbl">verified facts only</text>
  <line x1="864" y1="180" x2="864" y2="298" class="line" marker-end="url(#arrow)"/>
  <text x="872" y="245" class="lbl">state of</text>
  <text x="872" y="259" class="lbl">every file</text>

  <!-- row B: requirements -->
  <rect x="26" y="300" width="140" height="60" rx="8" class="fast"/>
  <text x="96" y="325" text-anchor="middle" class="name">Orient + assign</text>
  <text x="96" y="344" text-anchor="middle" class="sub">group by capability</text>
  <rect x="218" y="300" width="140" height="60" rx="8" class="strong"/>
  <text x="288" y="325" text-anchor="middle" class="name">Synthesise</text>
  <text x="288" y="344" text-anchor="middle" class="sub">cites facts by id</text>
  <rect x="410" y="300" width="140" height="60" rx="8" class="strong"/>
  <text x="480" y="325" text-anchor="middle" class="name">Assess support</text>
  <text x="480" y="344" text-anchor="middle" class="sub">direct … conflicting</text>
  <rect x="602" y="300" width="140" height="60" rx="8" class="prog"/>
  <text x="672" y="325" text-anchor="middle" class="name">Apply review</text>
  <text x="672" y="344" text-anchor="middle" class="sub">confirm, edit, reject</text>
  <rect x="794" y="300" width="140" height="60" rx="8" class="prog"/>
  <text x="864" y="325" text-anchor="middle" class="name">Report</text>
  <text x="864" y="344" text-anchor="middle" class="sub">result as JSON</text>

  <line x1="166" y1="330" x2="216" y2="330" class="line" marker-end="url(#arrow)"/>
  <text x="192" y="322" text-anchor="middle" class="lbl">groups</text>
  <line x1="358" y1="330" x2="408" y2="330" class="line" marker-end="url(#arrow)"/>
  <text x="384" y="322" text-anchor="middle" class="lbl">drafts</text>
  <line x1="550" y1="330" x2="600" y2="330" class="line" marker-end="url(#arrow)"/>
  <text x="576" y="322" text-anchor="middle" class="lbl">rated</text>
  <line x1="742" y1="330" x2="792" y2="330" class="line" marker-end="url(#arrow)"/>
  <text x="768" y="322" text-anchor="middle" class="lbl">final</text>

  <!-- inputs below -->
  <rect x="6" y="412" width="180" height="36" rx="6" class="input"/>
  <text x="96" y="435" text-anchor="middle" class="sub">capabilities file (optional)</text>
  <line x1="96" y1="412" x2="96" y2="362" class="line dash" marker-end="url(#arrow)"/>
  <text x="104" y="391" class="lbl">replaces orient</text>
  <rect x="582" y="412" width="180" height="36" rx="6" class="input"/>
  <text x="672" y="435" text-anchor="middle" class="sub">review file (optional)</text>
  <line x1="672" y1="412" x2="672" y2="362" class="line dash" marker-end="url(#arrow)"/>
  <text x="680" y="391" class="lbl">your decisions</text>
  <rect x="784" y="412" width="160" height="36" rx="6" class="input"/>
  <text x="864" y="435" text-anchor="middle" class="sub">md, html, csv, openspec</text>
  <line x1="864" y1="360" x2="864" y2="410" class="line" marker-end="url(#arrow)"/>
  <text x="872" y="391" class="lbl">render</text>
</svg>
